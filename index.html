<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
  <meta name="theme-color" content="#14131f" />
  <meta name="description" content="Havre — ton espace pour souffler. Un compagnon bienveillant pour comprendre tes émotions, respirer et avancer. Privé, sans jugement." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Havre" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon.svg" />
  <link rel="stylesheet" href="./css/styles.css" />
  <title>Havre — ton espace pour souffler</title>
</head>
<body>
  <!-- Décor : aurores animées en fond -->
  <div class="app-bg" aria-hidden="true">
    <span class="blob blob--1"></span>
    <span class="blob blob--2"></span>
    <span class="blob blob--3"></span>
    <div class="grain"></div>
  </div>

  <!-- Barre supérieure -->
  <header class="topbar">
    <a class="brand" href="#/today" aria-label="Havre, accueil">
      <span class="brand__logo" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="30" height="30">
          <defs>
            <linearGradient id="bg-logo" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#9B8CFF" />
              <stop offset="0.55" stop-color="#FF9EC4" />
              <stop offset="1" stop-color="#6FE7C7" />
            </linearGradient>
          </defs>
          <path d="M20 3c4.5 4.2 9 7.4 9 14.4C29 25.5 25.2 31 20 36c-5.2-5-9-10.5-9-18.6C11 10.4 15.5 7.2 20 3Z" fill="url(#bg-logo)"/>
          <path d="M12.5 25c3-2.4 5-2.4 7.5 0s4.5 2.4 7.5 0" fill="none" stroke="#14131f" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
        </svg>
      </span>
      <span class="brand__name">Havre</span>
    </a>
    <button class="icon-btn" id="themeToggle" aria-label="Changer le thème" title="Thème clair/sombre">
      <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0-13v2m0 16v2M4 12H2m20 0h-2M5.6 5.6 4.2 4.2m15.6 15.6-1.4-1.4M18.4 5.6l1.4-1.4M4.2 19.8l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </header>

  <!-- Contenu (rendu par le routeur) -->
  <main id="view" class="view" role="main" tabindex="-1"></main>

  <!-- Navigation basse, façon app mobile -->
  <nav class="nav" aria-label="Navigation principale">
    <a class="nav__item" data-route="today" href="#/today">
      <span class="nav__icon"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3 3 10v10a1 1 0 0 0 1 1h5v-6h6v6h5a1 1 0 0 0 1-1V10Z"/></svg></span>
      <span class="nav__label">Aujourd'hui</span>
    </a>
    <a class="nav__item" data-route="mood" href="#/mood">
      <span class="nav__icon"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 21c-5-3.4-9-6.9-9-11.3A5 5 0 0 1 12 6a5 5 0 0 1 9 3.7C21 14.1 17 17.6 12 21Z"/></svg></span>
      <span class="nav__label">Humeur</span>
    </a>
    <a class="nav__item" data-route="breathe" href="#/breathe">
      <span class="nav__icon"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.4" fill="currentColor"/></svg></span>
      <span class="nav__label">Respire</span>
    </a>
    <a class="nav__item" data-route="journal" href="#/journal">
      <span class="nav__icon"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6 3h11a2 2 0 0 1 2 2v16l-3-2-3 2-3-2-3 2V5a2 2 0 0 1 2-2Z" opacity="0.35"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M9 8h7M9 12h7"/></svg></span>
      <span class="nav__label">Journal</span>
    </a>
    <a class="nav__item" data-route="chat" href="#/chat">
      <span class="nav__icon"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg></span>
      <span class="nav__label">Compagnon</span>
    </a>
  </nav>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <noscript>
    <div style="padding:2rem;color:#fff;font-family:system-ui">
      Havre a besoin de JavaScript pour fonctionner. Active-le pour continuer 💜
    </div>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
