      <path d="M114 176 q12 4 8 20 q-10 2 -14 -8" fill="none" stroke="#1C1917" stroke-width="6" stroke-linecap="round"/>
      <!-- joues -->
      <ellipse cx="56" cy="150" rx="13" ry="8" fill="#F6A6C0" opacity="0.8"/>
      <ellipse cx="144" cy="150" rx="13" ry="8" fill="#F6A6C0" opacity="0.8"/>
      <!-- nez -->
      <path d="M92 134 q8 7 16 0 q-8 8 -16 0 z" fill="#F19BB4" stroke="#1C1917" stroke-width="2" stroke-linejoin="round"/>
      <!-- casquette bleue -->
      <path d="M52 82 q6 -48 48 -48 q42 0 48 48 z" fill="#2E7BC4" stroke="#1C1917" stroke-width="6" stroke-linejoin="round"/>
      <path d="M148 82 q32 -2 36 12 q-3 9 -15 9 q-22 1 -40 -7 z" fill="#2E7BC4" stroke="#1C1917" stroke-width="5" stroke-linejoin="round"/>
