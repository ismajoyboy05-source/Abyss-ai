  <rect width="1080" height="1320" fill="#FFFDF5"/>
  <text x="540" y="70" text-anchor="middle" font-size="52" font-weight="bold" fill="#2A2622">CHATO 🐱</text>
  <text x="540" y="104" text-anchor="middle" font-size="24" fill="#8A7F6B">chat à casquette — feuille d'expressions · atterrissage raté « PAF ! »</text>

  <!-- LIGNE 1 -->
  <g transform="translate(100,150)"><use href="#chato"/>
    <ellipse cx="78" cy="118" rx="16" ry="19" fill="#1C1917"/><path d="M78 104 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z" fill="#fff"/>
    <ellipse cx="122" cy="118" rx="16" ry="19" fill="#1C1917"/><path d="M122 104 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z" fill="#fff"/>
    <path d="M64 98 q10 -6 20 -1 M116 97 q10 -5 20 1" fill="none" stroke="#1C1917" stroke-width="4" stroke-linecap="round"/>
    <path d="M100 142 q-9 12 -18 4 M100 142 q9 12 18 4" fill="none" stroke="#1C1917" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="200" y="372" text-anchor="middle" font-size="22" font-weight="bold" fill="#2A2622">Content ✦</text>

  <g transform="translate(440,150)"><use href="#chato"/>
    <ellipse cx="78" cy="118" rx="15" ry="18" fill="#fff" stroke="#1C1917" stroke-width="4"/><circle cx="78" cy="120" r="7" fill="#1C1917"/>
    <ellipse cx="122" cy="118" rx="15" ry="18" fill="#fff" stroke="#1C1917" stroke-width="4"/><circle cx="122" cy="120" r="7" fill="#1C1917"/>
