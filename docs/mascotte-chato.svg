  </g>
  <text x="540" y="372" text-anchor="middle" font-size="22" font-weight="bold" fill="#2A2622">Surpris</text>

  <g transform="translate(780,150)"><use href="#chato"/>
    <circle cx="78" cy="120" r="8" fill="#1C1917"/><circle cx="81" cy="117" r="2.6" fill="#fff"/>
    <circle cx="122" cy="120" r="8" fill="#1C1917"/><circle cx="125" cy="117" r="2.6" fill="#fff"/>
    <path d="M100 142 q-8 10 -16 3 M100 142 q8 10 16 3" fill="none" stroke="#1C1917" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="880" y="372" text-anchor="middle" font-size="22" font-weight="bold" fill="#2A2622">Neutre</text>

  <!-- LIGNE 2 -->
  <g transform="translate(100,480)"><use href="#chato"/>
    <ellipse cx="78" cy="118" rx="17" ry="20" fill="#fff" stroke="#1C1917" stroke-width="4"/><circle cx="78" cy="121" r="6" fill="#1C1917"/>
    <ellipse cx="122" cy="118" rx="17" ry="20" fill="#fff" stroke="#1C1917" stroke-width="4"/><circle cx="122" cy="121" r="6" fill="#1C1917"/>
    <ellipse cx="100" cy="152" rx="8" ry="10" fill="#3A3436" stroke="#1C1917" stroke-width="2.5"/>
    <path d="M156 106 q6 9 0 16 q-6 -7 0 -16 z" fill="#7EC8F0" stroke="#1C1917" stroke-width="2"/>
  </g>
  <text x="200" y="700" text-anchor="middle" font-size="22" font-weight="bold" fill="#2A2622">Panique</text>

  <g transform="translate(440,480)"><use href="#chato"/>
    <path d="M60 100 l24 7" stroke="#1C1917" stroke-width="5" stroke-linecap="round"/>
    <path d="M140 100 l-24 7" stroke="#1C1917" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="78" cy="120" rx="14" ry="17" fill="#1C1917"/><circle cx="78" cy="122" r="5" fill="#fff"/>
    <ellipse cx="122" cy="120" rx="14" ry="17" fill="#1C1917"/><circle cx="122" cy="122" r="5" fill="#fff"/>
    <path d="M90 152 q10 -6 20 0" fill="none" stroke="#1C1917" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="540" y="700" text-anchor="middle" font-size="22" font-weight="bold" fill="#2A2622">Grognon</text>

  <g transform="translate(780,480)"><use href="#chato"/>
    <path d="M70 112 l14 14 M84 112 l-14 14" stroke="#1C1917" stroke-width="5" stroke-linecap="round"/>
    <path d="M116 112 l14 14 M130 112 l-14 14" stroke="#1C1917" stroke-width="5" stroke-linecap="round"/>
    <path d="M92 150 q8 -6 16 0" fill="none" stroke="#1C1917" stroke-width="4" stroke-linecap="round"/>
    <text x="150" y="86" font-size="26" fill="#FFD23F">✦</text>
  </g>
  <text x="880" y="700" text-anchor="middle" font-size="22" font-weight="bold" fill="#2A2622">KO (x_x)</text>

  <!-- SIGNATURE -->
  <line x1="90" y1="778" x2="990" y2="778" stroke="#EAE2CF" stroke-width="3"/>
  <text x="540" y="828" text-anchor="middle" font-size="30" font-weight="bold" fill="#2A2622">Atterrissage signature — « PAF ! »</text>
  <text x="540" y="858" text-anchor="middle" font-size="20" fill="#8A7F6B">Le chat qui retombe toujours… mal</text>
  <g transform="translate(440,950)">
    <path d="M-40 -20 q30 40 60 0" fill="none" stroke="#7FB2E0" stroke-width="4" stroke-dasharray="6 9" stroke-linecap="round"/>
    <ellipse cx="60" cy="30" rx="96" ry="22" fill="#B8B8BC" stroke="#1C1917" stroke-width="6"/>
    <ellipse cx="60" cy="36" rx="56" ry="10" fill="#CFCFD3"/>
    <path d="M40 22 l12 12 M52 22 l-12 12" stroke="#1C1917" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M68 22 l12 12 M80 22 l-12 12" stroke="#1C1917" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M96 22 l14 -6 M98 30 l15 0 M96 38 l14 6" stroke="#1C1917" stroke-width="4" stroke-linecap="round"/>
    <text x="190" y="6" font-size="46" font-weight="bold" fill="#2E7BC4" transform="rotate(-8 190 6)">PAF!</text>
    <text x="-70" y="-30" font-size="24" fill="#7FB2E0">✦</text>
  </g>

  <!-- PALETTE -->
  <text x="90" y="1092" font-size="26" font-weight="bold" fill="#2A2622">Palette (fixe)</text>
  <g transform="translate(90,1112)">
    <rect x="0" y="0" width="150" height="70" rx="10" fill="#B8B8BC" stroke="#2A2622" stroke-width="3"/>
    <rect x="165" y="0" width="150" height="70" rx="10" fill="#9A9AA0" stroke="#2A2622" stroke-width="3"/>
    <rect x="330" y="0" width="150" height="70" rx="10" fill="#2E7BC4" stroke="#2A2622" stroke-width="3"/>
    <rect x="495" y="0" width="150" height="70" rx="10" fill="#FFD23F" stroke="#2A2622" stroke-width="3"/>
    <rect x="660" y="0" width="150" height="70" rx="10" fill="#F6A6C0" stroke="#2A2622" stroke-width="3"/>
    <rect x="825" y="0" width="150" height="70" rx="10" fill="#1C1917" stroke="#2A2622" stroke-width="3"/>
    <text x="75" y="98" text-anchor="middle" font-size="15" fill="#2A2622">#B8B8BC corps</text>
    <text x="240" y="98" text-anchor="middle" font-size="15" fill="#2A2622">#9A9AA0 gris foncé</text>
    <text x="405" y="98" text-anchor="middle" font-size="15" fill="#2A2622">#2E7BC4 casquette</text>
    <text x="570" y="98" text-anchor="middle" font-size="15" fill="#2A2622">#FFD23F étoile</text>
    <text x="735" y="98" text-anchor="middle" font-size="15" fill="#2A2622">#F6A6C0 joues/nez</text>
    <text x="900" y="98" text-anchor="middle" font-size="15" fill="#2A2622">#1C1917 contour</text>
