      <path d="M34 128 l-24 -5 M34 138 l-26 3 M36 148 l-24 9" fill="none" stroke="#1C1917" stroke-width="4" stroke-linecap="round"/>
      <path d="M166 128 l24 -5 M166 138 l26 3 M164 148 l24 9" fill="none" stroke="#1C1917" stroke-width="4" stroke-linecap="round"/>
