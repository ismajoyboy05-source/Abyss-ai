<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1320" font-family="'Trebuchet MS','Segoe UI',sans-serif">
  <defs>
    <g id="chato">
      <!-- oreilles -->
      <path d="M42 74 L34 28 L78 56 Z" fill="#B8B8BC" stroke="#1C1917" stroke-width="6" stroke-linejoin="round"/>
      <path d="M48 64 L44 40 L66 54 Z" fill="#9A9AA0"/>
      <path d="M158 74 L166 28 L122 56 Z" fill="#B8B8BC" stroke="#1C1917" stroke-width="6" stroke-linejoin="round"/>
      <path d="M152 64 L156 40 L134 54 Z" fill="#9A9AA0"/>
      <!-- corps -->
      <ellipse cx="100" cy="128" rx="66" ry="62" fill="#B8B8BC" stroke="#1C1917" stroke-width="6"/>
      <ellipse cx="100" cy="144" rx="42" ry="42" fill="#CFCFD3"/>
