    <path d="M64 108 l22 8" stroke="#2A2622" stroke-width="5" stroke-linecap="round"/>
    <path d="M136 108 l-22 8" stroke="#2A2622" stroke-width="5" stroke-linecap="round"/>
    <circle cx="80" cy="122" r="8" fill="#2A2622"/><circle cx="120" cy="122" r="8" fill="#2A2622"/>
    <path d="M100 134 l8 6 -8 6 -8 -6 z" fill="#F5A623" stroke="#2A2622" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <text x="540" y="700" text-anchor="middle" font-size="22" font-weight="bold" fill="#2A2622">Grognon</text>

  <g transform="translate(780,480)"><use href="#pio"/>
    <path d="M72 112 l14 14 M86 112 l-14 14" stroke="#2A2622" stroke-width="5" stroke-linecap="round"/>
    <path d="M114 112 l14 14 M128 112 l-14 14" stroke="#2A2622" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="100" cy="146" rx="7" ry="5" fill="#C8641E"/>
    <text x="150" y="86" font-size="26" fill="#FFD23F">✦</text>
  </g>
  <text x="880" y="700" text-anchor="middle" font-size="22" font-weight="bold" fill="#2A2622">KO (x_x)</text>

