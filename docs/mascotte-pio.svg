    <text x="405" y="98" text-anchor="middle" font-size="15" fill="#2A2622">#E5372F casquette</text>
    <text x="570" y="98" text-anchor="middle" font-size="15" fill="#2A2622">#F5A623 bec/pattes</text>
    <text x="735" y="98" text-anchor="middle" font-size="15" fill="#2A2622">#F6A6A0 joues</text>
