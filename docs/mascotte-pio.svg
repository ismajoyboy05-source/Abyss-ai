  <text x="540" y="104" text-anchor="middle" font-size="24" fill="#8A7F6B">poussin à casquette — feuille d'expressions · chute « POUF ! »</text>

  <!-- LIGNE 1 -->
  <g transform="translate(100,150)"><use href="#pio"/>
    <ellipse cx="78" cy="118" rx="15" ry="17" fill="#fff" stroke="#2A2622" stroke-width="4"/><circle cx="80" cy="120" r="7" fill="#2A2622"/><circle cx="83" cy="116" r="2.6" fill="#fff"/>
    <ellipse cx="122" cy="118" rx="15" ry="17" fill="#fff" stroke="#2A2622" stroke-width="4"/><circle cx="124" cy="120" r="7" fill="#2A2622"/><circle cx="127" cy="116" r="2.6" fill="#fff"/>
    <path d="M66 100 q8 -8 18 -3 M116 97 q10 -5 18 3" fill="none" stroke="#2A2622" stroke-width="4" stroke-linecap="round"/>
