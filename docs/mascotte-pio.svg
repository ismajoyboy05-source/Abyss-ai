    <g transform="translate(120,-30) rotate(20)"><path d="M0 0 q2 -22 22 -22 q20 0 22 22 z" fill="#E5372F" stroke="#2A2622" stroke-width="4"/><path d="M0 0 q-14 0 -16 6 q2 4 8 4 q10 0 18 -4 z" fill="#C22B25" stroke="#2A2622" stroke-width="3"/></g>
    <text x="150" y="6" font-size="46" font-weight="bold" fill="#E5372F" transform="rotate(-8 150 6)">POUF!</text>
  </g>

