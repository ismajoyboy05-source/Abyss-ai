  <text x="540" y="828" text-anchor="middle" font-size="30" font-weight="bold" fill="#2A2622">Chute signature — « POUF ! »</text>
  <g transform="translate(540,945)">
    <path d="M-150 20 q-20 -40 20 -46 q6 -30 44 -20 q24 -26 54 -2 q34 -8 34 24 q30 6 16 34 q10 26 -22 26 l-172 0 q-30 2 -24 -26 z" fill="#FFF4CC" stroke="#2A2622" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="0" cy="34" rx="120" ry="26" fill="#F7DD5E" stroke="#2A2622" stroke-width="6"/>
    <ellipse cx="0" cy="40" rx="70" ry="12" fill="#FCEFA6"/>
    <path d="M-34 26 l14 14 M-20 26 l-14 14" stroke="#2A2622" stroke-width="5" stroke-linecap="round"/>
    <path d="M20 26 l14 14 M34 26 l-14 14" stroke="#2A2622" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="2" cy="44" rx="5" ry="4" fill="#C8641E"/>
