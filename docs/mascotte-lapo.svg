  <rect width="1080" height="1320" fill="#FFFDF5"/>
  <text x="540" y="70" text-anchor="middle" font-size="52" font-weight="bold" fill="#2A2622">LAPO 🐰</text>
  <text x="540" y="104" text-anchor="middle" font-size="24" fill="#8A7F6B">lapin à casquette — feuille d'expressions · rebond « BOING ! »</text>

  <!-- LIGNE 1 -->
  <g transform="translate(100,150)"><use href="#lapo"/>
    <ellipse cx="80" cy="122" rx="14" ry="17" fill="#2A2622"/><circle cx="84" cy="115" r="3.4" fill="#fff"/><circle cx="76" cy="126" r="2" fill="#fff"/>
    <ellipse cx="120" cy="122" rx="14" ry="17" fill="#2A2622"/><circle cx="124" cy="115" r="3.4" fill="#fff"/><circle cx="116" cy="126" r="2" fill="#fff"/>
    <path d="M96 140 l4 5 4 -5 z" fill="#F19BB4" stroke="#2A2622" stroke-width="2" stroke-linejoin="round"/>
    <path d="M100 145 q-6 6 -12 3 M100 145 q6 6 12 3" fill="none" stroke="#2A2622" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <text x="200" y="372" text-anchor="middle" font-size="22" font-weight="bold" fill="#2A2622">Content ✦</text>

