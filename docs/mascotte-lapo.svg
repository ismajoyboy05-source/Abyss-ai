    <path d="M74 116 l12 10 M74 130 l12 -10" stroke="#2A2622" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M126 116 l-12 10 M126 130 l-12 -10" stroke="#2A2622" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M96 140 l4 5 4 -5 z" fill="#F19BB4" stroke="#2A2622" stroke-width="2" stroke-linejoin="round"/>
    <path d="M100 145 q-6 6 -12 3 M100 145 q6 6 12 3" fill="none" stroke="#2A2622" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M70 106 q4 6 -2 10 M78 104 q3 6 -3 9" stroke="#F19BB4" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <text x="540" y="700" text-anchor="middle" font-size="22" font-weight="bold" fill="#2A2622">Étoilé / amoureux</text>

  <g transform="translate(780,480)"><use href="#lapo"/>
    <path d="M72 114 l14 14 M86 114 l-14 14" stroke="#2A2622" stroke-width="5" stroke-linecap="round"/>
    <path d="M114 114 l14 14 M128 114 l-14 14" stroke="#2A2622" stroke-width="5" stroke-linecap="round"/>
    <path d="M96 142 l4 5 4 -5 z" fill="#F19BB4" stroke="#2A2622" stroke-width="2" stroke-linejoin="round"/>
    <path d="M90 150 q10 -6 20 0" fill="none" stroke="#2A2622" stroke-width="3.5" stroke-linecap="round"/>
    <text x="150" y="90" font-size="26" fill="#F6A6C0">✦</text>
  </g>
  <text x="880" y="700" text-anchor="middle" font-size="22" font-weight="bold" fill="#2A2622">KO (x_x)</text>

  <!-- SIGNATURE -->
  <line x1="90" y1="778" x2="990" y2="778" stroke="#EAE2CF" stroke-width="3"/>
  <text x="540" y="828" text-anchor="middle" font-size="30" font-weight="bold" fill="#2A2622">Rebond signature — « BOING ! »</text>
  <text x="540" y="858" text-anchor="middle" font-size="20" fill="#8A7F6B">Lapo rebondit trop haut… puis s'écrase</text>
  <g transform="translate(430,940)">
    <!-- arcs de rebond -->
    <path d="M-20 60 q40 -90 80 0" fill="none" stroke="#F6A6C0" stroke-width="4" stroke-dasharray="6 8" stroke-linecap="round"/>
    <path d="M20 60 q40 -70 80 0" fill="none" stroke="#F6A6C0" stroke-width="4" stroke-dasharray="6 8" stroke-linecap="round"/>
    <!-- lapo étiré en rebond -->
    <g transform="translate(120,-6)">
      <ellipse cx="0" cy="0" rx="34" ry="46" fill="#FFFFFF" stroke="#2A2622" stroke-width="6"/>
      <path d="M-16 -40 l14 14 M-2 -40 l-14 14" stroke="#2A2622" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M2 -40 l14 14 M16 -40 l-14 14" stroke="#2A2622" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M-6 -20 l6 7 6 -7 z" fill="#F19BB4" stroke="#2A2622" stroke-width="2"/>
      <path d="M-40 -80 q-20 4 -22 40 M40 -80 q20 4 22 40" fill="none" stroke="#2A2622" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text x="230" y="30" font-size="46" font-weight="bold" fill="#E5372F" transform="rotate(-8 230 30)">BOING!</text>
    <text x="70" y="-30" font-size="24" fill="#F6A6C0">✦</text>
  </g>

  <!-- PALETTE -->
  <text x="90" y="1092" font-size="26" font-weight="bold" fill="#2A2622">Palette (fixe)</text>
  <g transform="translate(90,1112)">
    <rect x="0" y="0" width="150" height="70" rx="10" fill="#FFFFFF" stroke="#2A2622" stroke-width="3"/>
    <rect x="165" y="0" width="150" height="70" rx="10" fill="#FBEDF0" stroke="#2A2622" stroke-width="3"/>
    <rect x="330" y="0" width="150" height="70" rx="10" fill="#E5372F" stroke="#2A2622" stroke-width="3"/>
    <rect x="495" y="0" width="150" height="70" rx="10" fill="#F6A6C0" stroke="#2A2622" stroke-width="3"/>
    <rect x="660" y="0" width="150" height="70" rx="10" fill="#F19BB4" stroke="#2A2622" stroke-width="3"/>
    <rect x="825" y="0" width="150" height="70" rx="10" fill="#2A2622" stroke="#2A2622" stroke-width="3"/>
    <text x="75" y="98" text-anchor="middle" font-size="15" fill="#2A2622">#FFFFFF corps</text>
    <text x="240" y="98" text-anchor="middle" font-size="15" fill="#2A2622">#FBEDF0 ventre</text>
    <text x="405" y="98" text-anchor="middle" font-size="15" fill="#2A2622">#E5372F casquette</text>
    <text x="570" y="98" text-anchor="middle" font-size="15" fill="#2A2622">#F6A6C0 oreilles</text>
    <text x="735" y="98" text-anchor="middle" font-size="15" fill="#2A2622">#F19BB4 nez</text>
    <text x="900" y="98" text-anchor="middle" font-size="15" fill="#2A2622">#2A2622 contour</text>
  </g>
