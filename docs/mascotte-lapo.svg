  </g>
  <text x="880" y="372" text-anchor="middle" font-size="22" font-weight="bold" fill="#2A2622">Neutre</text>

  <!-- LIGNE 2 -->
  <g transform="translate(100,480)"><use href="#lapo"/>
    <ellipse cx="80" cy="122" rx="17" ry="20" fill="#fff" stroke="#2A2622" stroke-width="4"/><circle cx="80" cy="125" r="6" fill="#2A2622"/>
    <ellipse cx="120" cy="122" rx="17" ry="20" fill="#fff" stroke="#2A2622" stroke-width="4"/><circle cx="120" cy="125" r="6" fill="#2A2622"/>
    <path d="M96 142 l4 5 4 -5 z" fill="#F19BB4" stroke="#2A2622" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="100" cy="152" rx="8" ry="10" fill="#C56074" stroke="#2A2622" stroke-width="2.5"/>
    <path d="M154 108 q6 9 0 16 q-6 -7 0 -16 z" fill="#7EC8F0" stroke="#2A2622" stroke-width="2"/>
  </g>
