      <path d="M148 118 q14 8 14 40 q0 18 -12 20 q-8 -2 -9 -22 q-1 -22 -5 -36 z" fill="#F6A6C0" opacity="0.85"/>
      <!-- corps -->
      <ellipse cx="100" cy="128" rx="60" ry="58" fill="#FFFFFF" stroke="#2A2622" stroke-width="6"/>
      <ellipse cx="100" cy="142" rx="38" ry="38" fill="#FBEDF0"/>
