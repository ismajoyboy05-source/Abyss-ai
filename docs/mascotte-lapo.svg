  </g>
  <text x="540" y="372" text-anchor="middle" font-size="22" font-weight="bold" fill="#2A2622">Surpris</text>

  <g transform="translate(780,150)"><use href="#lapo"/>
    <path d="M70 122 q10 -12 20 0" fill="none" stroke="#2A2622" stroke-width="5" stroke-linecap="round"/>
    <path d="M110 122 q10 -12 20 0" fill="none" stroke="#2A2622" stroke-width="5" stroke-linecap="round"/>
