      <path d="M56 96 q4 -50 44 -50 q40 0 44 50 z" fill="#E5372F" stroke="#2A2622" stroke-width="6" stroke-linejoin="round"/>
      <path d="M100 46 q-2 -14 8 -16 M100 44 q2 -12 12 -8" fill="none" stroke="#2A2622" stroke-width="5" stroke-linecap="round"/>
      <path d="M56 96 q-4 6 40 6 q44 0 40 -6 z" fill="#C22B25" stroke="#2A2622" stroke-width="4" stroke-linejoin="round"/>
